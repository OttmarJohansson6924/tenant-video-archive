[package]
name = "tenant-video-archive"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time", "fs"] }
url = "2.5"
